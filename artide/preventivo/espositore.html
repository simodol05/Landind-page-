<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Espositore QR da banco · Artide</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 1100px; background: #060c22; font-family: Figtree, sans-serif; }
  .scene { position: relative; width: 1000px; height: 1100px; overflow: hidden; }
  /* l'igloo del sito sullo sfondo, sfocato come una vetrina di sera */
  .bg { position: absolute; inset: -40px; background: url(igloo.jpg) center 30% / cover; filter: blur(10px) saturate(1.1) brightness(.7); }
  .tint { position: absolute; inset: 0; background:
      radial-gradient(70% 40% at 30% 4%, rgba(70, 220, 170, .32), transparent 70%),
      radial-gradient(60% 35% at 80% 0%, rgba(120, 110, 255, .25), transparent 70%),
      linear-gradient(180deg, rgba(6,12,34,.35) 0%, rgba(6,12,34,.15) 45%, rgba(6,12,34,.85) 100%); }
  .counter { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, #2a2118 0%, #18120c 100%); box-shadow: 0 -2px 0 rgba(255,214,150,.25); }

  /* l'espositore */
  .stand { position: absolute; left: 50%; top: 191px; width: 640px; transform: translateX(-50%); padding: 54px 56px 46px;
    background: linear-gradient(170deg, rgba(23,36,77,.96), rgba(9,17,46,.97)); border: 2px solid #d9bf8c; border-radius: 34px;
    box-shadow: 0 40px 90px rgba(0,0,0,.55), inset 0 0 0 6px rgba(217,191,140,.12); text-align: center; color: #eef0f6; }
  .stand::after { content: ""; position: absolute; left: 90px; right: 90px; bottom: -64px; height: 64px; border-radius: 0 0 18px 18px;
    background: linear-gradient(180deg, rgba(217,191,140,.55), rgba(140,118,80,.7)); z-index: -1; }
  .brand b { display: block; font-family: Fraunces, serif; font-weight: 400; font-size: 44px; letter-spacing: .2em; padding-left: .2em; }
  .brand span { font-size: 13px; letter-spacing: .32em; color: #a6aec4; }
  .kicker { margin-top: 34px; font-size: 15px; letter-spacing: .3em; color: #d9bf8c; font-weight: 600; }
  h1 { font-family: Fraunces, serif; font-weight: 400; font-size: 52px; line-height: 1.06; margin-top: 12px; letter-spacing: -.01em; }
  h1 em { color: #e3c993; }
  .qr { position: relative; width: 300px; height: 300px; margin: 34px auto 0; background: #fff; border-radius: 26px; padding: 26px; }
  .qr img { width: 100%; height: 100%; display: block; }
  .qr .ico { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%); background: #0b1638; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; font-family: Fraunces, serif; color: #e3c993; font-size: 34px; }
  .how { margin-top: 28px; font-size: 20px; color: #dfe3ee; }
  .how b { color: #fff; font-weight: 600; }
  .pills { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
  .pills span { font-size: 15px; border: 1px solid rgba(217,191,140,.55); color: #e9dcc0; border-radius: 30px; padding: 7px 16px; }
</style>
</head>
<body>
  <div class="scene">
    <div class="bg"></div>
    <div class="tint"></div>
    <div class="counter"></div>
    <div class="stand">
      <div class="brand"><b>ARTIDE</b><span>GELATERIA · PASTICCERIA</span></div>
      <div class="kicker">ENTRA NELL'IGLOO</div>
      <h1>Un gusto in regalo<br>ti aspetta <em>qui dentro</em>.</h1>
      <div class="qr"><img src="qr-finto.svg" alt=""><div class="ico">A</div></div>
      <p class="how"><b>Inquadra</b> e mostra lo schermo alla cassa</p>
      <div class="pills"><span>Ordina</span><span>Seguici</span><span>Lascia una recensione</span></div>
    </div>
  </div>
</body>
</html>
