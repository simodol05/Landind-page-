# Netlify configuration for the English build of the accounting app.
# Set "property-accounting" as the base directory when you create the site:
# Netlify then reads this file and publishes this folder as its own site,
# leaving the Italian original untouched.

[build]
  publish = "."

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
