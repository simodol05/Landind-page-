<style>
:root {
  --bg: #f7f5f1; --surface: #ffffff; --surface-hover: #f4f0e8;
  --text-primary: #1d1a15; --text-secondary: #5a5347; --text-tertiary: #8d8474; --text-quaternary: #c9c0ac;
  --border: #e8e1d3; --border-hover: #d6cab0;
  --positive: #2f8f52; --danger: #c23b2b; --warning: #b9781c;
  --accent: #ab6a30; --accent-hover: #8f5726; --accent-soft: rgba(171,106,48,0.11); --accent-soft-2: rgba(171,106,48,0.22);
  --chart-1: #ab6a30; --chart-2: #5c7a52;
  --stripe: rgba(29,26,21,0.02);
  --shadow-sm: 0 1px 2px rgba(30,22,10,0.05);
  --shadow-md: 0 6px 20px rgba(30,22,10,0.08), 0 1px 3px rgba(30,22,10,0.06);
  --radius: 12px; --radius-sm: 8px;
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15130f; --surface: #201c16; --surface-hover: #2a251d;
    --text-primary: #f3ede2; --text-secondary: #bcb2a0; --text-tertiary: #8b8172; --text-quaternary: #58503f;
    --border: #332c21; --border-hover: #493f2d;
    --positive: #5cbb7a; --danger: #e8756a; --warning: #e0a655;
    --accent: #dd9a5c; --accent-hover: #eaad76; --accent-soft: rgba(221,154,92,0.14); --accent-soft-2: rgba(221,154,92,0.28);
    --chart-1: #dd9a5c; --chart-2: #8fac7f;
    --stripe: rgba(255,255,255,0.025);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-md: 0 10px 28px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3);
  }
}
* { scrollbar-width: thin; scrollbar-color: var(--border-hover) transparent; }
::-webkit-scrollbar { width: 10px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-quaternary); }

body { margin:0; background: var(--bg); font-family: var(--font-sans); color: var(--text-primary); line-height:1.45; }
.r-app { max-width: 1100px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(60px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px)); }
[style*="overflow-x:auto"] { -webkit-overflow-scrolling: touch; }
button, .tab, .act button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.r-app * { box-sizing: border-box; }
.r-app button, .r-app input, .r-app select, .r-app textarea { font: inherit; color: inherit; }
.r-app svg { display: block; }

.hdr { position: relative; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.hdr::after { content:''; position:absolute; left:0; bottom:-1px; height:2px; width:120px; background: linear-gradient(90deg, var(--accent), transparent); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-ic { width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); flex: 0 0 auto; }
.brand-ic svg { width: 22px; height: 22px; }
.brand div { font-size: 18px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
.brand span { font-size: 12px; color: var(--text-tertiary); font-weight: 400; letter-spacing: 0.01em; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { display: flex; align-items: center; gap: 7px; padding: 8px 13px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: background .15s ease, color .15s ease, box-shadow .15s ease; }
.tab:hover { background: var(--surface-hover); color: var(--text-primary); }
.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent-soft-2); }
.tab.active svg { color: var(--accent); }
.tab svg { width: 14px; height: 14px; transition: color .15s ease; }
.tab .ts { display: none; }

.kpi { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi-c { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 14px; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.kpi-c::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: linear-gradient(90deg, var(--accent), var(--accent-soft)); }
.kpi-c:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.kpi-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.kpi-ic { width: 15px; height: 15px; color: var(--accent); flex: 0 0 auto; opacity: 0.9; }
.kpi-ic svg { width: 100%; height: 100%; }
.kpi-l { font-size: 11px; color: var(--text-tertiary); text-transform: lowercase; letter-spacing: 0.01em; }
.kpi-v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; letter-spacing: -0.01em; }
.kpi-s { font-size: 11px; margin-top: 5px; font-variant-numeric: tabular-nums; color: var(--text-tertiary); }
.kpi-s.p { color: var(--positive); } .kpi-s.n { color: var(--danger); } .kpi-s.w { color: var(--warning); }

.pan { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; background: var(--surface); box-shadow: var(--shadow-sm); transition: box-shadow .15s ease; }
.pan-t { font-size: 15px; font-weight: 650; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
.pan-t svg { width: 16px; height: 16px; color: var(--accent); }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; padding: 10px 12px; font-weight: 600; font-size: 10.5px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-tertiary); background: var(--surface-hover); border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); white-space: nowrap; }
.tbl th:first-child { border-top-left-radius: var(--radius-sm); border-bottom-left-radius: var(--radius-sm); }
.tbl th:last-child { border-top-right-radius: var(--radius-sm); border-bottom-right-radius: var(--radius-sm); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-variant-numeric: tabular-nums; transition: box-shadow .12s ease; }
.tbl tbody tr:nth-child(even) td { background: var(--stripe); }
.tbl tbody tr:hover td { background: var(--surface-hover); color: var(--text-primary); }
.tbl tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tbl tr:last-child td { border-bottom: none; }

.tag { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.tg-s { background: rgba(47,143,82,0.13); color: var(--positive); }
.tg-w { background: rgba(185,120,28,0.13); color: var(--warning); }
.tg-n { background: rgba(141,132,116,0.13); color: var(--text-tertiary); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); font-size: 13px; cursor: pointer; transition: all .15s ease; }
.btn:hover { background: var(--surface-hover); border-color: var(--border-hover); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
.btn-p { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: #fff; border-color: transparent; box-shadow: 0 1px 2px rgba(20,14,6,0.18), 0 3px 8px rgba(171,106,48,0.25); }
.btn-p:hover { filter: brightness(1.05); box-shadow: 0 2px 4px rgba(20,14,6,0.2), 0 5px 14px rgba(171,106,48,0.32); }
.btn-d { color: var(--danger); border-color: rgba(194,59,43,0.35); background: rgba(194,59,43,0.06); }
.btn-d:hover { background: rgba(194,59,43,0.13); border-color: var(--danger); }

.own { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.own-c { position: relative; overflow: hidden; border: 1px solid var(--border); border-top: 3px solid var(--card-color, var(--accent)); border-radius: var(--radius); padding: 16px; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease; }
.own-c:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.own-n { font-size: 15px; font-weight: 650; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em; }
.own-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; flex: 0 0 auto; background: var(--card-color, var(--accent)); }
.own-r { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.own-r:last-child { border: none; }
.own-r .l { color: var(--text-tertiary); } .own-r .v { font-variant-numeric: tabular-nums; font-weight: 600; }
.own-r .v.pos { color: var(--positive); } .own-r .v.neg { color: var(--danger); }

.st-t { width: 100%; border-collapse: collapse; font-size: 13px; }
.st-t td { padding: 12px; border-bottom: 1px solid var(--border); }
.st-t tr:last-child td { border: none; }
.st-t .l { color: var(--text-tertiary); width: 45%; } .st-t .v { font-variant-numeric: tabular-nums; font-weight: 600; }

.inp { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 10px; font-size: 16px; background: var(--surface); color: var(--text-primary); transition: border-color .15s ease, box-shadow .15s ease; }
.inp:hover { border-color: var(--border-hover); }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp-calc { background: var(--surface-hover); }
.inp-manual { background: #fff6dd; border-color: #e0ac2e; }
@media (prefers-color-scheme: dark) { .inp-manual { background: #3d3200; border-color: #a68b00; } }

.form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
.form-row .inp, .form-row select { width: auto; flex: 1; min-width: 110px; }
.form-row .btn { flex: 0 0 auto; }
.form-row label.btn { position: relative; overflow: hidden; }

.act { display: flex; gap: 4px; }
.act button { padding: 5px 9px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text-secondary); transition: all .15s ease; }
.act button:hover { background: var(--surface-hover); color: var(--text-primary); border-color: var(--border-hover); }

.empty { text-align: center; padding: 52px 20px; color: var(--text-tertiary); }
.empty-ic { width: 42px; height: 42px; margin: 0 auto 14px; color: var(--text-quaternary); }
.empty-t { font-size: 14px; font-weight: 650; color: var(--text-secondary); margin-bottom: 4px; }
.empty-s { font-size: 12px; max-width: 320px; margin: 0 auto; line-height: 1.5; }

@keyframes tabFadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
#body.tab-fade { animation: tabFadeIn .28s ease; }

.hid { display: none !important; }
.tr { text-align: right; }
.mt3 { margin-top: 12px; }
.flex { display: flex; align-items: center; gap: 8px; }
.wrp { flex-wrap: wrap; }
.jb { justify-content: space-between; }
.fs11 { font-size: 11px; } .fs12 { font-size: 12px; }
.cl-ter { color: var(--text-tertiary); } .cl-sec { color: var(--text-secondary); }

/* labelled field: essential on mobile, where placeholders are not enough */
.fld { display: flex; flex-direction: column; gap: 4px; flex: 1 1 150px; min-width: 130px; max-width: 480px; }
.fld > span { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.02em; }
.fld .inp { width: 100%; }

/* auto-save indicator */
.save-ind { position: fixed; z-index: 90; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-md); color: var(--text-tertiary); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
.save-ind.on { opacity: 1; transform: translateY(0); }
.save-ind.ok { color: var(--positive); border-color: rgba(47,143,82,0.35); }
.save-ind.ko { color: var(--danger); border-color: rgba(194,59,43,0.4); }

/* warning shown when the browser cannot store data permanently */
.warn-bar { display: none; align-items: flex-start; gap: 10px; padding: 12px 14px; margin-bottom: 16px; border-radius: var(--radius); font-size: 12.5px; line-height: 1.5; background: rgba(185,120,28,0.12); border: 1px solid rgba(185,120,28,0.4); color: var(--text-primary); }
.warn-bar.on { display: flex; }
.warn-bar b { color: var(--warning); }

/* welcome note, shown only once */
.hint-bar { display: none; align-items: flex-start; gap: 10px; padding: 13px 15px; margin-bottom: 16px; border-radius: var(--radius); font-size: 12.5px; line-height: 1.55; background: var(--accent-soft); border: 1px solid var(--accent-soft-2); }
.hint-bar.on { display: flex; }
.hint-bar b { color: var(--accent); }
.hint-bar button { flex: 0 0 auto; align-self: center; margin-left: auto; padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); font-size: 12px; cursor: pointer; }

/* sign-in screen: shown until you are authenticated with Supabase */
.auth-gate { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-card { width: 100%; max-width: 340px; border: 1px solid var(--border); border-radius: var(--radius); padding: 30px 26px; background: var(--surface); box-shadow: var(--shadow-md); }
.auth-card .brand-ic { margin: 0 auto 16px; }
.auth-t { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.auth-s { text-align: center; font-size: 12px; color: var(--text-tertiary); margin-bottom: 22px; line-height: 1.5; }
.auth-msg { margin-top: 12px; text-align: center; font-size: 11.5px; min-height: 16px; line-height: 1.5; }
.auth-msg.err { color: var(--danger); }
.acct-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-hover); margin-bottom: 12px; font-size: 12.5px; }

@media (max-width: 760px) {
  .kpi { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi-v { font-size: 19px; }
  .hdr { flex-direction: column; align-items: flex-start; gap: 0; padding-bottom: 14px; margin-bottom: 16px; }
  .pan { padding: 14px; }

  /* tab bar pinned to the bottom: within thumb reach */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; margin: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -2px 12px rgba(30,22,10,0.08); }
  .tab { flex-direction: column; gap: 3px; padding: 7px 1px; font-size: 10px; line-height: 1.15; text-align: center; border-radius: 8px; min-width: 0; overflow: hidden; }
  .tab svg { width: 19px; height: 19px; }
  .tab .tl { display: none; }
  .tab .ts { display: block; }
  .r-app { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .save-ind { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }

  /* tables -> stacked cards: no horizontal scrolling, every field stays tappable */
  .tbl { display: block; }
  .tbl thead { display: none; }
  .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl tbody tr { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: 10px; padding: 2px 12px; }
  .tbl tbody tr:nth-child(even) td, .tbl tbody tr:hover td { background: transparent; }
  .tbl tbody tr:hover td:first-child { box-shadow: none; }
  .tbl td { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; text-align: left; border-bottom: 1px solid var(--border); }
  .tbl tr td:last-child { border-bottom: none; }
  .tbl td.tr { text-align: right; }
  .tbl td::before { content: attr(data-l); flex: 0 0 auto; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-tertiary); font-weight: 600; }
  .tbl td:not([data-l])::before { content: none; }
  .tbl td .inp { flex: 0 1 150px; max-width: 58%; text-align: right; }
  .tbl td .act { flex: 1 1 auto; justify-content: flex-end; }
  .tbl td .act button { flex: 1 1 auto; padding: 9px 10px; }

  /* forms: one field per row, no squashed inputs */
  .form-row { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 10px; }
  .form-row > .inp, .form-row > select, .form-row > .fld, .form-row > .btn, .form-row > label.btn { width: 100%; flex: 1 1 auto; min-width: 0; justify-content: center; }
  .form-row > label.fs12 { min-width: 0 !important; }
}
@media (pointer: coarse) {
  .tab { padding: 10px 14px; }
  .btn { padding: 11px 15px; }
  .act button { padding: 8px 12px; font-size: 12px; }
  .inp { padding: 11px 12px; }
}
</style>

<body>
<div class="r-app">

function parseCSV(text){
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/^﻿/,'');
  const firstLine = text.split('\n').find(l=>l.trim().length>0) || '';
  const commaCount = (firstLine.match(/,/g)||[]).length;
  const semiCount = (firstLine.match(/;/g)||[]).length;
  const delim = semiCount > commaCount ? ';' : ',';
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c==='"'){ if (text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if (c==='"') inQuotes = true;
      else if (c===delim){ row.push(field); field=''; }
      else if (c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  while (rows.length && rows[rows.length-1].every(f=>f.trim()==='')) rows.pop();
  if (!rows.length) return {headers:[], rows:[]};
  const headers = rows[0].map(h=>h.trim());
  const dataRows = rows.slice(1).filter(r=>r.some(f=>f.trim()!==''));
  return {headers, rows: dataRows};
}

function guessColumn(headers, aliases){
  const norm = h => h.toLowerCase().trim();
  let idx = headers.findIndex(h => aliases.includes(norm(h)));
  if (idx>-1) return headers[idx];
  idx = headers.findIndex(h => aliases.some(a => norm(h).includes(a)));
  return idx>-1 ? headers[idx] : '';
}

function parseDateFlexible(str){
  if(!str) return '';
  str = String(str).trim();
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m){
    const d=m[1].padStart(2,'0'), mo=m[2].padStart(2,'0'), y=m[3];
    return y+'-'+mo+'-'+d;
  }
  const d2 = new Date(str);
  if(!isNaN(d2.getTime())) return d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');
  return '';
}

function parseAmountFlexible(val){
  if(val===undefined||val===null) return 0;
  let str = String(val).trim().replace(/[€$\s]/g,'');
  if(!str) return 0;
  const neg = /^-/.test(str) || /^\(.*\)$/.test(str);
  str = str.replace(/[()\-]/g,'');
  const lastComma = str.lastIndexOf(','), lastDot = str.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    if(lastComma>lastDot) str = str.replace(/\./g,'').replace(',','.');
    else str = str.replace(/,/g,'');
  } else if(lastComma>-1){
    const after = str.length-lastComma-1;
    if(after===2) str = str.replace(',','.'); else str = str.replace(/,/g,'');
  }
  const n = parseFloat(str);
  return isNaN(n) ? 0 : (neg ? -n : n);
}

function ensureDefaults(d){
  if (!d.settings.property) d.settings.property = JSON.parse(JSON.stringify(defaultData.settings.property));
  d.settings.owners.forEach(o => { if (o.cleaningShare === undefined) o.cleaningShare = 0; });
  /* packages are split in half between Simona and Lorenzo: whoever already has
     50% on cleaning starts with the same share on packages too */
  d.settings.owners.forEach(o => { if (o.packageShare === undefined) o.packageShare = (o.cleaningShare || 0); });
  if (!Array.isArray(d.packages)) d.packages = [];
  return d;
}

let saveTimer = null, pending = false, indTimer = null;

function showSaveInd(ok){
  const el = document.getElementById('saveInd');
  if (!el) return;
  el.className = 'save-ind on ' + (ok ? 'ok' : 'ko');
  el.textContent = ok ? '✓ Saved' : '⚠ Save failed';
  if (indTimer) clearTimeout(indTimer);
  indTimer = setTimeout(function(){ el.className = 'save-ind ' + (ok ? 'ok' : 'ko'); }, ok ? 1600 : 5000);
}

function updateWarnBar(){
  const el = document.getElementById('warnBar');
  if (!el) return;
  if (storageMode === 'cloud') { el.className = 'warn-bar'; el.innerHTML = ''; return; }
  el.className = 'warn-bar on';
  el.innerHTML = '<div><b>Heads up:</b> the data cannot be saved or read online right now (check your internet connection). Changes made now may not reach your other devices until the connection is back.</div>';
}

/* saves on every change, batching keystrokes that come close together */
function saveData(immediate){
  pending = true;
  if (saveTimer) clearTimeout(saveTimer);
  if (immediate) { flushSave(); return; }
  saveTimer = setTimeout(flushSave, 350);
}

let booted = false;

async function flushSave(){
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  if (!pending || !currentUserId) return;
  pending = false;
  const { error } = await sb.from('app_data').upsert({ user_id: currentUserId, data: data, updated_at: new Date().toISOString() });
  storageMode = error ? 'error' : 'cloud';
  if (booted) showSaveInd(!error);
  updateWarnBar();
}

/* safety net: on mobile the tab is suspended without warning */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') flushSave();
});
window.addEventListener('pagehide', flushSave);
window.addEventListener('blur', flushSave);

async function loadRemoteData(userId){
  const { data: row, error } = await sb.from('app_data').select('data').eq('user_id', userId).maybeSingle();
  if (error) throw error;
  if (row && row.data) return ensureDefaults(row.data);
  const fresh = ensureDefaults(JSON.parse(JSON.stringify(defaultData)));
  const { error: insErr } = await sb.from('app_data').insert({ user_id: userId, data: fresh });
  if (insErr) throw insErr;
  return fresh;
}

function subscribeRealtime(userId){
  if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  realtimeChannel = sb
    .channel('app_data_' + userId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_data', filter: 'user_id=eq.' + userId }, function(payload){
      /* if you are typing in an open form right now, do not overwrite it: it will refresh on the next navigation */
      const formOpen = bookingFormOpen || expenseFormOpen || packageFormOpen || importPanelOpen;
      data = ensureDefaults(payload.new.data);
      if (!formOpen) show(currentTab);
    })
    .subscribe();
}

function getMonthIndex(d) {
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  if (y === 2026 && m >= 7) return m - 7;
  if (y === 2027 && m <= 6) return m + 5;
  return -1;
}

function recalcMonthly(i) {
  const m = data.monthly[i];
  if (!m.manual.netto) m.netto = m.incasso - m.pulizie - m.spese;
  if (!m.manual.margine) m.margine = m.incasso > 0 ? (m.netto / m.incasso * 100) : 0;
  if (!m.manual.occupazione) m.occupazione = m.days > 0 ? (m.notti / m.days * 100) : 0;
  if (!m.manual.adr) m.adr = m.notti > 0 ? (m.incasso / m.notti) : 0;
}

function syncMonthly() {
  data.monthly.forEach(m => {
    m.pren = 0; m.notti = 0; m.incasso = 0; m.pulizie = 0; m.spese = 0; m.manual = {};
  });
  data.bookings.forEach(b => {
    if (!b.startDate) return;
    const d = new Date(b.startDate + 'T00:00:00');
    const idx = getMonthIndex(d);
    if (idx >= 0 && idx < 12) {
      const m = data.monthly[idx];
      m.pren += 1;
      m.notti += (b.nights || 0);
      m.incasso += (b.revenue || 0);
      m.pulizie += (b.cleaning || 0);
    }
  });
  data.expenses.forEach(e => {
    if (!e.date) return;
    const d = new Date(e.date + 'T00:00:00');
    const idx = getMonthIndex(d);
    if (idx >= 0 && idx < 12) {
      data.monthly[idx].spese += (e.amount || 0);
    }
  });
  data.monthly.forEach((m, i) => recalcMonthly(i));
  saveData();
}

function compute() {
  const tr = data.bookings.reduce((s,b)=>s+(b.revenue||0),0);
  const tc = data.bookings.reduce((s,b)=>s+(b.cleaning||0),0);
  const te = data.bookings.reduce((s,b)=>s+(b.extra||0),0);
  const tn = tr - tc - te;
  const tx = data.expenses.reduce((s,e)=>s+(e.amount||0),0);
  const cf = tn - tx;
  const eq = parseFloat(data.settings.equity) || 0;
  const interest = (data.settings.mortgageRemaining || 0) * (data.settings.mortgageRate || 0);
  let roi = 0, roe = null, am = 0;
  if (data.settings.propertyValue > 0) roi = ((tn - tx) / data.settings.propertyValue) * 100;
  if (eq > 0) roe = ((tn - tx - interest) / eq) * 100;
  if (tr > 0) am = (tn / tr) * 100;
  const bwd = data.bookings.filter(b=>b.startDate && b.nights>0);
  const ngt = bwd.reduce((s,b)=>s+(b.nights||0),0);
  const occ = data.settings.availableDays > 0 ? (ngt / data.settings.availableDays) * 100 : 0;
  const adrT = bwd.reduce((s,b)=>s+(b.revenue||0),0);
  const adr = ngt > 0 ? adrT / ngt : 0;
  const rc = data.bookings.filter(b=>b.status==='Ricevuto').length;
  const pc = data.bookings.filter(b=>b.status==='Da ricevere').length;
  const rr = data.bookings.filter(b=>b.status==='Ricevuto').reduce((s,b)=>s+(b.revenue||0),0);
  const pr = data.bookings.filter(b=>b.status==='Da ricevere').reduce((s,b)=>s+(b.revenue||0),0);
  return {tr, tc, te, tn, tx, cf, roi, roe, am, ngt, occ, adr, rc, pc, rr, pr, interest, eq};
}

function computeOwners() {
  const netBaseReceived = data.bookings
    .filter(b => b.status === 'Ricevuto')
    .reduce((s, b) => s + ((b.revenue||0) - (b.cleaning||0) - (b.extra||0)), 0);
  const netBasePending = data.bookings
    .filter(b => b.status === 'Da ricevere')
    .reduce((s, b) => s + ((b.revenue||0) - (b.cleaning||0) - (b.extra||0)), 0);
  const cleaningReceived = data.bookings
    .filter(b => b.status === 'Ricevuto')
    .reduce((s, b) => s + (b.cleaning||0), 0);
  const cleaningPending = data.bookings
    .filter(b => b.status === 'Da ricevere')
    .reduce((s, b) => s + (b.cleaning||0), 0);

  /* i pacchetti sono un ricavo a se': non passano dal netto dell'immobile e
     si dividono solo fra chi ha una quota pacchetti (Simona e Lorenzo, 50/50) */
  const packs = data.packages || [];
  const packReceived = packs
    .filter(p => p.status === 'Ricevuto')
    .reduce((s, p) => s + (p.amount||0), 0);
  const packPending = packs
    .filter(p => p.status !== 'Ricevuto')
    .reduce((s, p) => s + (p.amount||0), 0);

  return data.settings.owners.map(o => {
    const cleaningRec = cleaningReceived * (o.cleaningShare||0);
    const cleaningPen = cleaningPending * (o.cleaningShare||0);
    const packRec = packReceived * (o.packageShare||0);
    const packPen = packPending * (o.packageShare||0);
    const received = netBaseReceived * (o.share||0) + cleaningRec + packRec;
    const pending = netBasePending * (o.share||0) + cleaningPen + packPen;
    const total = received + pending;
    const expenses = data.expenses.reduce((s, e) => s + ((e.paidBy === o.name) ? (e.amount||0) : 0), 0);
    const balance = total - expenses;
    return { name: o.name, share: o.share, cleaningShare: o.cleaningShare, packageShare: o.packageShare, received, pending, total, expenses, balance, cleaningRec, cleaningPen, packRec, packPen };
  });
}

  if(!importState) return [];
  const {headers, rows, map} = importState;
  const idx = key => map[key] ? headers.indexOf(map[key]) : -1;
  const iStart = idx('startDate'), iEnd = idx('endDate'), iNights = idx('nights'), iGuest = idx('guest'), iRev = idx('revenue'), iClean = idx('cleaning'), iExtra = idx('extra');
  return rows.map(r=>{
    const startDate = iStart>-1 ? parseDateFlexible(r[iStart]) : '';
    const endDate = iEnd>-1 ? parseDateFlexible(r[iEnd]) : '';
    let nights = iNights>-1 ? (parseFloat(String(r[iNights]).replace(',','.'))||0) : 0;
    if(!nights && startDate && endDate){
      const d1=new Date(startDate+'T00:00:00'), d2=new Date(endDate+'T00:00:00');
      const diff = Math.round((d2-d1)/86400000);
      if(diff>0) nights = diff;
    }
    const guest = iGuest>-1 ? String(r[iGuest]).trim() : '';
    const revenue = iRev>-1 ? parseAmountFlexible(r[iRev]) : 0;
    const cleaning = iClean>-1 ? parseAmountFlexible(r[iClean]) : 0;
    const extra = iExtra>-1 ? parseAmountFlexible(r[iExtra]) : 0;
    return { startDate, endDate, nights, guest, revenue, cleaning, extra };
  });
}

function renderImportPanel(){
  if(!importState){
    return '<div class="pan" id="importPanel">'+
      '<div class="pan-t">Import from Airbnb / Booking</div>'+
      '<div class="fs12 cl-sec" style="margin-bottom:12px;line-height:1.6">Upload the CSV file downloaded from your host dashboard: on <b>Airbnb</b> go to Earnings &rarr; Export CSV (or Reservations &rarr; All &rarr; Export), on <b>Booking.com</b> use the Extranet under Reservations &rarr; Export. You can run the import as many times as you like: bookings that are already there are never duplicated.</div>'+
      '<div class="form-row">'+
        '<label class="btn btn-p" style="cursor:pointer">Choose CSV file<input type="file" accept=".csv,text/csv" style="display:none" onchange="handleImportFile(this)"></label>'+
        '<button class="btn" onclick="cancelImport()">Cancel</button>'+
      '</div>'+
    '</div>';
  }

  const {headers, platform, status, fileName, map} = importState;
  const fieldDefs = [
    {key:'startDate', label:'Start date', required:true},
    {key:'endDate', label:'End date', required:false},
    {key:'nights', label:'Nights', required:false},
    {key:'guest', label:'Guest', required:false},
    {key:'revenue', label:'Revenue €', required:true},
    {key:'cleaning', label:'Cleaning €', required:false},
    {key:'extra', label:'Extras €', required:false}
  ];
  const mapRows = fieldDefs.map(f=>{
    let opts = '<option value="">— none —</option>';
    headers.forEach(h=>{ opts += '<option '+(map[f.key]===h?'selected':'')+'>'+esc(h)+'</option>'; });
    return '<div class="form-row">'+fld(f.label+(f.required?' *':''),'<select class="inp" onchange="updateImportMap(\''+f.key+'\',this.value)">'+opts+'</select>')+'</div>';
  }).join('');

  const built = buildImportRows();
  const missingRequired = !map.startDate || !map.revenue;
  const existingKey = b => (b.startDate||'')+'|'+(b.endDate||'')+'|'+Math.round((b.revenue||0)*100);
  const existingSet = new Set(data.bookings.map(existingKey));
  const invalidCount = built.filter(b=>!b.startDate).length;
  const dupCount = built.filter(b => b.startDate && existingSet.has(existingKey(b))).length;
  const importableCount = built.length - invalidCount - dupCount;

  const previewRows = built.slice(0,5).map(b=>'<tr>'+
      '<td data-l="date">'+(b.startDate?fd(b.startDate):'<span class="cl-ter">date not recognised</span>')+(b.endDate&&b.endDate!==b.startDate?' → '+fd(b.endDate):'')+'</td>'+
      '<td data-l="nights">'+(b.nights||'—')+'</td>'+
      '<td data-l="guest">'+esc(b.guest||'—')+'</td>'+
      '<td class="tr" data-l="revenue">€'+fmt(b.revenue)+'</td>'+
      '<td class="tr" data-l="cleaning">€'+fmt(b.cleaning)+'</td>'+
    '</tr>').join('');

  const platOpts = ['Airbnb','Booking','Direct','Altro'].map(p=>opt(p, platform, platl(p))).join('');
  const statOpts = ['Ricevuto','Da ricevere'].map(s=>opt(s, status, stl(s))).join('');

  return '<div class="pan" id="importPanel">'+
    '<div class="pan-t">Import from CSV — '+esc(fileName)+'</div>'+
    '<div class="fs11 cl-ter" style="margin-bottom:10px">Match your file columns to the app fields. Fields marked * are required.</div>'+
    mapRows +
    '<div class="form-row" style="margin-top:6px">'+
      fld('Platform','<select class="inp" onchange="updateImportMeta(\'platform\',this.value)">'+platOpts+'</select>')+
      fld('Mark all as','<select class="inp" onchange="updateImportMeta(\'status\',this.value)">'+statOpts+'</select>')+
    '</div>'+
    (missingRequired ? '<div class="fs11" style="color:var(--danger);margin:8px 0">Map at least Start date and Revenue to continue.</div>' : '')+
    '<div class="mt3" style="overflow-x:auto"><table class="tbl"><thead><tr><th>date</th><th>nights</th><th>guest</th><th class="tr">revenue</th><th class="tr">cleaning</th></tr></thead><tbody>'+previewRows+'</tbody></table></div>'+
    '<div class="fs11 cl-ter mt3">Preview of the first '+Math.min(5,built.length)+' rows out of '+built.length+' in total'+(dupCount?(' · '+dupCount+' already present (skipped)'):'')+(invalidCount?(' · '+invalidCount+' with an unrecognised date (skipped)'):'')+'.</div>'+
    '<div class="form-row mt3">'+
      '<button class="btn btn-p" onclick="confirmImport()"'+(missingRequired?' disabled':'')+'>Import '+Math.max(importableCount,0)+' bookings</button>'+
      '<button class="btn" onclick="cancelImport()">Cancel</button>'+
    '</div>'+
  '</div>';
}

function summTotals(){
  const tot = data.monthly.reduce((a,m)=>({
    pren:a.pren+m.pren, notti:a.notti+m.notti, incasso:a.incasso+m.incasso,
    pulizie:a.pulizie+m.pulizie, spese:a.spese+m.spese, netto:a.netto+m.netto
  }),{pren:0,notti:0,incasso:0,pulizie:0,spese:0,netto:0});
  tot.mar = tot.incasso>0 ? (tot.netto/tot.incasso*100) : 0;
  tot.occ = data.settings.availableDays>0 ? (tot.notti/data.settings.availableDays*100) : 0;
  tot.adr = tot.notti>0 ? (tot.incasso/tot.notti) : 0;
  return tot;
}

/* Updates only the derived cells, without redrawing the table:
   redrawing it would lose focus and close the phone keyboard. */
function refreshSummRow(i){
  const m = data.monthly[i];
  ['netto','margine','occupazione','adr'].forEach(function(k){
    const el = document.getElementById('sm-'+k+'-'+i);
    if (!el) return;
    el.className = 'inp tr ' + (m.manual[k] ? 'inp-manual' : 'inp-calc');
    if (el !== document.activeElement) el.value = m[k].toFixed(2);
  });
  const t = summTotals();
  const put = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  put('smt-pren', t.pren); put('smt-notti', t.notti);
  put('smt-incasso', '€'+fmt(t.incasso)); put('smt-pulizie', '€'+fmt(t.pulizie));
  put('smt-spese', '€'+fmt(t.spese)); put('smt-netto', '€'+fmt(t.netto));
  put('smt-margine', fmt1(t.mar)+'%'); put('smt-occupazione', fmt1(t.occ)+'%');
  put('smt-adr', '€'+fmt(t.adr));
}

function renderOwn() {
  const own = computeOwners();
  let html = '<div class="own">';
  own.forEach((o,i) => {
    const hasCleaning = (o.cleaningShare || 0) > 0;
    const hasPack = (o.packageShare || 0) > 0;
    const cleanPct = ((o.cleaningShare||0)*100).toFixed(0)+'% cleaning';
    const packPct = ((o.packageShare||0)*100).toFixed(0)+'% packages';
    let shareLabel = (o.share*100).toFixed(1).replace('.0','')+'%';
    if (hasCleaning) shareLabel += ' + '+cleanPct;
    if (hasPack) shareLabel += ' + '+packPct;
    const color = OWNER_COLORS[i % OWNER_COLORS.length];
    const initial = (o.name||'?').trim().charAt(0).toUpperCase();
    html += '<div class="own-c" style="--card-color:'+color+'">'+
      '<div class="own-n"><span class="own-avatar">'+initial+'</span>'+o.name+'</div>'+
      '<div class="own-r"><span class="l">share</span><span class="v">'+shareLabel+'</span></div>'+
      '<div class="own-r"><span class="l">net received</span><span class="v">€'+fmt(o.received)+'</span></div>'+
      '<div class="own-r"><span class="l">net to receive</span><span class="v">€'+fmt(o.pending)+'</span></div>';
    if (hasCleaning) {
      html += '<div class="own-r"><span class="l">&nbsp;&nbsp;of which '+cleanPct+' received</span><span class="v">€'+fmt(o.cleaningRec)+'</span></div>'+
              '<div class="own-r"><span class="l">&nbsp;&nbsp;of which '+cleanPct+' to receive</span><span class="v">€'+fmt(o.cleaningPen)+'</span></div>';
    }
    if (hasPack) {
      html += '<div class="own-r"><span class="l">&nbsp;&nbsp;of which '+packPct+' received</span><span class="v">€'+fmt(o.packRec)+'</span></div>'+
              '<div class="own-r"><span class="l">&nbsp;&nbsp;of which '+packPct+' to receive</span><span class="v">€'+fmt(o.packPen)+'</span></div>';
    }
    html += '<div class="own-r"><span class="l">total net</span><span class="v" style="font-weight:700">€'+fmt(o.total)+'</span></div>'+
      '<div class="own-r"><span class="l">expenses paid</span><span class="v">€'+fmt(o.expenses)+'</span></div>'+

function show(tab){
  currentTab = tab;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  const body = document.getElementById('body');
  if (tab==='dash') body.innerHTML = renderDash();
  else if (tab==='book') body.innerHTML = renderBook();
  else if (tab==='pack') body.innerHTML = renderPack();
  else if (tab==='expe') body.innerHTML = renderExpe();
  else if (tab==='summ') body.innerHTML = renderSumm();
  else if (tab==='owne') body.innerHTML = renderOwn();
  else if (tab==='sett') body.innerHTML = renderSett();
  body.classList.remove('tab-fade');
  void body.offsetWidth;
  body.classList.add('tab-fade');
}

function handleImportFile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const { headers, rows } = parseCSV(e.target.result);
    if (!headers.length){ alert('The file looks empty or unreadable.'); return; }
    const map = {
      startDate: guessColumn(headers, IMPORT_ALIASES.startDate),
      endDate: guessColumn(headers, IMPORT_ALIASES.endDate),
      nights: guessColumn(headers, IMPORT_ALIASES.nights),
      guest: guessColumn(headers, IMPORT_ALIASES.guest),
      revenue: guessColumn(headers, IMPORT_ALIASES.revenue),
      cleaning: guessColumn(headers, IMPORT_ALIASES.cleaning),
      extra: guessColumn(headers, IMPORT_ALIASES.extra)
    };
    const lowerName = file.name.toLowerCase();
    const platform = lowerName.includes('booking') ? 'Booking' : 'Airbnb';
    importState = { fileName: file.name, headers, rows, map, platform, status: 'Ricevuto' };
    show('book');
  };
  reader.readAsText(file, 'UTF-8');
  input.value = '';
}
function updateImportMap(key, value){
  if (!importState) return;
  importState.map[key] = value;
  show('book');
}
function updateImportMeta(key, value){
  if (!importState) return;
  importState[key] = value;
  show('book');
}
function confirmImport(){
  if (!importState) return;
  const built = buildImportRows();
  const existingKey = b => (b.startDate||'')+'|'+(b.endDate||'')+'|'+Math.round((b.revenue||0)*100);
  const existingSet = new Set(data.bookings.map(existingKey));
  let nextId = data.bookings.length ? Math.max(...data.bookings.map(x=>x.id))+1 : 1;
  let added = 0, skippedDup = 0, skippedInvalid = 0;
  built.forEach(b=>{
    if (!b.startDate){ skippedInvalid++; return; }
    const key = existingKey(b);
    if (existingSet.has(key)){ skippedDup++; return; }
    existingSet.add(key);
    data.bookings.push({
      id: nextId++, startDate: b.startDate, endDate: b.endDate || b.startDate, nights: b.nights,
      guest: b.guest, property: data.settings.property.name, platform: importState.platform,
      revenue: b.revenue, cleaning: b.cleaning, extra: b.extra, status: importState.status, note: 'Imported from CSV'
    });
    added++;
  });
  syncMonthly();
  importPanelOpen = false; importState = null;
  show('book');
  let msg = 'Import complete: '+added+' bookings added.';
  if (skippedDup) msg += '\n'+skippedDup+' already present, skipped.';
  if (skippedInvalid) msg += '\n'+skippedInvalid+' with an unrecognised date, skipped.';
  alert(msg);
}
function saveBooking(){
  const startDate = document.getElementById('bStart').value;

  const guest = document.getElementById('bGuest').value;

  const platform = document.getElementById('bPlat').value;
  const revenue = parseFloat(document.getElementById('bRev').value) || 0;
  const cleaning = parseFloat(document.getElementById('bClean').value) || 0;
  const extra = parseFloat(document.getElementById('bExtra').value) || 0;
  const status = document.getElementById('bStatus').value;
  const note = document.getElementById('bNote').value;
  if (editingBookingId) {
    const b = data.bookings.find(x=>x.id===editingBookingId);
    if (b) Object.assign(b, {startDate,endDate,nights,guest,property,platform,revenue,cleaning,extra,status,note});
  } else {
    const newId = data.bookings.length ? Math.max(...data.bookings.map(x=>x.id))+1 : 1;
    data.bookings.push({id:newId,startDate,endDate,nights,guest,property,platform,revenue,cleaning,extra,status,note});
  }
  bookingFormOpen = false; editingBookingId = null;
  syncMonthly();
  show('book');
}

function exportJSON(){
  flushSave();
  const str = JSON.stringify(data, null, 2);
  const d = new Date();
  const name = 'rustico_backup_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  /* on a phone downloading a file is not always possible: when the system
     share sheet is there we use it, so the backup can be emailed or saved
     to Files with a single tap */
  try {
    if (navigator.share && navigator.canShare) {
      const f = new File([str], name, {type:'application/json'});
      if (navigator.canShare({files:[f]})) {
        navigator.share({files:[f], title:'Backup Rustico & Co.'}).catch(function(){});
        return;
      }
    }
  } catch(e) {}
  const blob = new Blob([str], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function importJSON(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.settings || !imported.bookings || !imported.expenses || !imported.monthly) {
        throw new Error('invalid file structure');
      }
      data = ensureDefaults(imported);
      saveData();
      syncMonthly();
      show(currentTab);
      alert('Data imported successfully!');
    } catch(err){
      alert('Error in the JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}
